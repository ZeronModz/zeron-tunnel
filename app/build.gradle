plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'dev.zeron.tunnel'
    compileSdk 36

    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "dev.zeron.tunnel"
        minSdk 32
        targetSdk 36
        versionCode 59
        versionName "1.0.8.8"

        ndk {
            abiFilters 'arm64-v8a'
        }
        vectorDrawables.useSupportLibrary = true
        resourceConfigurations += ['en', 'bn', 'bn-rBD']
    }

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding false
        dataBinding false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/INDEX.LIST',
                         'META-INF/DEPENDENCIES', 'META-INF/*.SF', 'META-INF/*.DSA',
                         'META-INF/*.RSA', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'DebugProbesKt.bin', '**/kotlin/**', 'junit/**',
                         'org/junit/**', 'org/hamcrest/**', 'LICENSE-junit.txt']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    androidResources {
        noCompress 'dat', 'so'
    }
}

