name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Gradle assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK components (API 36)
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1); fi
          echo "using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace --info > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "=== error counts by file ==="
            grep -aoE "^[^ ]+\.java:[0-9]+: error: [^=]*" build.log | sed -E 's/:[0-9]+: error: /|/' | sed -E 's/ \[[^]]*\]$//' | sort | uniq -c | sort -rn | head -60
            echo "=== error type counts ==="
            grep -aoE "error: [^=]*" build.log | sed 's/error: //' | sed 's/\[[^]]*\]//g' | sort | uniq -c | sort -rn | head -40
            echo "=== first 400 errors ==="
            grep -a "error:" build.log | head -400
            echo "=== What went wrong ==="
            grep -a -A25 "\* What went wrong" build.log | head -50
            echo "=== last 30 lines ==="
            tail -30 build.log
          fi
          exit $rc

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeronTunnel-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload full build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload mapping / reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/outputs/**
          if-no-files-found: ignore
